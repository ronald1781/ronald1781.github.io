<div class="app-container animate-fade-in">

  <!-- Desktop Top/Side Navigation (hidden on mobile, shown on md+) -->
  <header class="desktop-nav glass-panel">
    <div class="nav-brand">
      <div class="brand-avatar">
        <i class="fa-solid fa-code"></i>
      </div>
      <div class="brand-text">
        <h3>Ronald Portfolio</h3>
        <span>Software Developer</span>
      </div>
    </div>
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="fa-solid fa-house"></i> <span>Inicio</span>
      </a>
      <a routerLink="/projects" routerLinkActive="active">
        <i class="fa-solid fa-briefcase"></i> <span>Proyectos</span>
      </a>
      <a routerLink="/skills" routerLinkActive="active">
        <i class="fa-solid fa-bolt"></i> <span>Habilidades</span>
      </a>
      <a routerLink="/contact" routerLinkActive="active">
        <i class="fa-solid fa-envelope"></i> <span>Contacto</span>
      </a>
    </nav>
  </header>

  <!-- Main Scrollable Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Bottom Navigation (shown on mobile, hidden on md+) -->
  <nav class="mobile-bottom-nav glass-panel">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span class="nav-label">Inicio</span>
    </a>
    <a routerLink="/projects" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-briefcase"></i>
      <span class="nav-label">Proyectos</span>
    </a>
    <a routerLink="/skills" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-bolt"></i>
      <span class="nav-label">Habilidades</span>
    </a>
    <a routerLink="/contact" routerLinkActive="active" class="nav-item">
      <i class="fa-solid fa-envelope"></i>
      <span class="nav-label">Contacto</span>
    </a>
  </nav>

  <!-- Floating Action Buttons -->
  <div class="floating-actions">
    <!-- WhatsApp Button -->
    <a href="https://wa.me/5199995555" target="_blank" class="floating-btn whatsapp-btn" title="Contáctame por WhatsApp">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    
    <!-- Chatbot Button -->
    <button class="floating-btn chatbot-btn" (click)="toggleChat()" title="Habla con mi asistente IA">
      <i class="fa-solid fa-robot"></i>
    </button>
  </div>

  <!-- Chatbot Window -->
  <div class="chatbot-window glass-panel animate-fade-in" *ngIf="isChatOpen">
    <div class="chat-header">
      <div class="chat-title">
        <i class="fa-solid fa-robot"></i> Asistente IA
      </div>
      <button class="close-chat" (click)="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="chat-body">
      <div class="chat-message bot">
        <p>¡Hola! Soy el asistente virtual de Ronald. ¿En qué te puedo ayudar hoy?</p>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" placeholder="Escribe un mensaje..." class="chat-input" disabled>
      <button class="send-btn" disabled><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

</div>
